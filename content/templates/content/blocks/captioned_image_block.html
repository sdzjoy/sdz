{% load wagtailimages_tags %}
{% image value.image width-1600 as rendition %}
<figure class="content-image content-image--{{ value.width }}">
  <img src="{{ rendition.url }}"
       width="{{ rendition.width }}"
       height="{{ rendition.height }}"
       alt="{{ value.alt_text|default:value.image.description|default:value.image.title }}"
       loading="lazy">
  {% if value.caption or value.source %}
    <figcaption>
      {% if value.caption %}{{ value.caption }}{% endif %}
      {% if value.source %}<span class="content-image__source">来源：{{ value.source }}</span>{% endif %}
    </figcaption>
  {% endif %}
</figure>
