worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    limit_req_zone $binary_remote_addr zone=public:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=sensitive:10m rate=2r/s;

    upstream django { server web:8000; keepalive 8; }

    server {
        listen 8080;
        client_max_body_size 10m;

        location / {
            limit_req zone=public burst=30 nodelay;
            proxy_pass http://django;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
            proxy_set_header X-Real-IP $http_cf_connecting_ip;
            proxy_set_header Connection "";
            proxy_read_timeout 65s;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }

        location ~ ^/(account|cms|django-admin)/ {
            limit_req zone=sensitive burst=8 nodelay;
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
            proxy_set_header X-Real-IP $http_cf_connecting_ip;
            proxy_read_timeout 65s;
        }
    }
}

