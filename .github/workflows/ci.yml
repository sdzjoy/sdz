name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install dependencies
        run: python -m pip install --requirement requirements/dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Check Django configuration
        run: python manage.py check --settings=config.settings.test
      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - name: Test
        run: python -m pytest
