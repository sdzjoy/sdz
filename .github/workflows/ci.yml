name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install dependencies
        run: python -m pip install --requirement requirements/dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Check Django configuration
        run: python manage.py check --settings=config.settings.test
      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - name: Test
        run: python -m pytest
      - name: Validate Compose configuration
        env:
          DJANGO_SECRET_KEY: ci-compose-secret
          MFA_ENCRYPTION_KEY: ci-compose-mfa-key
          IDP_OIDC_PRIVATE_KEY: ci-compose-oidc-key
          TURNSTILE_SITE_KEY: ci-compose-site-key
          TURNSTILE_SECRET_KEY: ci-compose-turnstile-key
          POSTGRES_PASSWORD: ci-compose-database-password
          RESTORE_POSTGRES_PASSWORD: ci-compose-restore-password
        run: |
          docker compose config --quiet
          docker compose -f compose.production.yml --profile backup --profile restore-drill config --quiet
      - name: Build application image
        run: docker build --tag sdzjoy-platform:ci .
      - name: Verify isolated backup and restore
        env:
          APP_IMAGE: sdzjoy-platform:ci
          DJANGO_SECRET_KEY: ci-restore-secret
          MFA_ENCRYPTION_KEY: ci-restore-mfa-key
          IDP_OIDC_PRIVATE_KEY: ci-restore-oidc-key
          TURNSTILE_SITE_KEY: ci-restore-site-key
          TURNSTILE_SECRET_KEY: ci-restore-turnstile-key
          POSTGRES_PASSWORD: ci-restore-database-password
          RESTORE_POSTGRES_PASSWORD: ci-isolated-database-password
          DJANGO_EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
        run: bash scripts/ci_backup_restore.sh
