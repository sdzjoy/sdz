name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install dependencies
        run: python -m pip install --requirement requirements/dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Check Django configuration
        run: python manage.py check --settings=config.settings.test
      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - name: Test
        run: python -m pytest
      - name: Validate Compose configuration
        env:
          DJANGO_SECRET_KEY: ci-compose-secret
          MFA_ENCRYPTION_KEY: ci-compose-mfa-key
          POSTGRES_PASSWORD: ci-compose-database-password
        run: docker compose config --quiet
      - name: Build application image
        run: docker build --tag sdzjoy-platform:ci .
