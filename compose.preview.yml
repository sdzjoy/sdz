name: sdzjoy-preview

services:
  cloudflared:
    image: cloudflare/cloudflared:2026.8.2@sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token-file
      - /run/secrets/tunnel-token
    volumes:
      - ./private/tunnel-token:/run/secrets/tunnel-token:ro
    depends_on:
      proxy:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 80
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - frontend

